name: verify

on:
  pull_request:
    paths:
      - "provenance_core/**"
      - "provenance_verify/**"
      - "provenance_trust/**"
      - "provenance_privacy/**"
      - "provenance_transfer/**"
      - "docs/BUNDLE.md"
      - "docs/TRUST.md"
      - "docs/PRIVACY.md"
      - "docs/TRANSFER.md"
      - "tests/test_verify.py"
      - ".github/workflows/verify.yml"
  push:
    branches: ["main"]
    paths:
      - "provenance_core/**"
      - "provenance_verify/**"
      - "provenance_trust/**"
      - "provenance_privacy/**"
      - "docs/BUNDLE.md"
      - "docs/TRUST.md"
      - "docs/PRIVACY.md"
      - "tests/test_verify.py"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run independent verifier tests
        run: python3 -m unittest discover -s tests -p "test_verify.py" -v
