name: mcp

on:
  push:
    branches: [main]
    paths:
      - "provenance_mcp/**"
      - "tests/test_mcp.py"
      - "MCP.md"
      - "ROADMAP.md"
      - ".github/workflows/mcp.yml"
  pull_request:
    paths:
      - "provenance_mcp/**"
      - "tests/test_mcp.py"
      - "MCP.md"
      - "ROADMAP.md"
      - ".github/workflows/mcp.yml"

permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run MCP stdio integration tests
        run: python3 -m unittest tests.test_mcp -v
