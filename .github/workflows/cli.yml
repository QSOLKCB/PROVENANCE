name: cli

on:
  push:
    branches: [main]
    paths:
      - "provenance-cli/**"
      - "provenance_cli/**"
      - "provenance_core/**"
      - "provenance_store/**"
      - "provenance_custody/**"
      - "provenance_verify/**"
      - "provenance_trust/**"
      - "provenance_privacy/**"
      - "provenance_export/**"
      - "provenance_mcp/**"
      - "tests/test_cli.py"
      - "tests/test_package.py"
      - "tests/test_privacy.py"
      - "docs/PACKAGE.md"
      - "docs/TRUST.md"
      - "docs/PRIVACY.md"
      - "docs/CLI.md"
      - "docs/ROADMAP.md"
      - "README.md"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "provenance-cli/**"
      - "provenance_cli/**"
      - "provenance_core/**"
      - "provenance_store/**"
      - "provenance_custody/**"
      - "provenance_verify/**"
      - "provenance_trust/**"
      - "provenance_privacy/**"
      - "provenance_export/**"
      - "provenance_mcp/**"
      - "tests/test_cli.py"
      - "tests/test_package.py"
      - "tests/test_privacy.py"
      - "docs/PACKAGE.md"
      - "docs/TRUST.md"
      - "docs/PRIVACY.md"
      - "docs/CLI.md"
      - "docs/ROADMAP.md"
      - "README.md"
      - ".github/workflows/cli.yml"

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build Rust CLI
        run: cargo build --manifest-path provenance-cli/Cargo.toml --locked
      - name: Run Rust CLI unit tests
        run: cargo test --manifest-path provenance-cli/Cargo.toml --locked
      - name: Run terminal integration tests
        run: python3 -m unittest tests.test_cli -v
